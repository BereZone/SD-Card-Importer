name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT: SD Card File Importer.xcodeproj
  SCHEME: SD Card File Importer
  APP_NAME: SD Card File Importer

jobs:
  release:
    name: Build and draft release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Reject anything that is not strict MAJOR.MINOR.PATCH (with optional
      # prerelease/build metadata). A tag like v1.0 or v1.2.3.4 fails here
      # rather than producing a mislabelled release.
      - name: Validate tag is semver
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! echo "$VERSION" | grep -Eq "$SEMVER"; then
            echo "::error::Tag '$TAG' is not valid Semantic Versioning."
            echo "::error::Expected vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi

          if echo "$VERSION" | grep -q '^v'; then
            echo "::error::Tag '$TAG' has a doubled 'v' prefix."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # The tag is not the source of truth on its own -- the shipped app must
      # report the same version, or users cannot tell builds apart.
      - name: Check project metadata matches the tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PBXPROJ="$PROJECT/project.pbxproj"

          MARKETING=$(grep -m1 'MARKETING_VERSION' "$PBXPROJ" | sed 's/.*= *//; s/;//' | tr -d ' ')
          if [ "$MARKETING" != "$VERSION" ]; then
            echo "::error::MARKETING_VERSION is '$MARKETING' but the tag says '$VERSION'."
            echo "::error::Run 'make bump VERSION=$VERSION', commit, then re-tag."
            exit 1
          fi

          # Every MARKETING_VERSION occurrence must agree (Debug and Release
          # configurations are separate entries and drift easily).
          DISTINCT=$(grep 'MARKETING_VERSION' "$PBXPROJ" | sed 's/.*= *//; s/;//' | tr -d ' ' | sort -u | wc -l)
          if [ "$DISTINCT" -ne 1 ]; then
            echo "::error::MARKETING_VERSION differs between build configurations:"
            grep 'MARKETING_VERSION' "$PBXPROJ" | sed 's/^/  /'
            exit 1
          fi

          echo "MARKETING_VERSION matches the tag."

      - name: Extract release notes from changelog
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            echo "::error::Move the [Unreleased] entries under that heading first."
            exit 1
          fi

          # Collect the section, stopping at the next heading OR at the link
          # reference definitions at the foot of the file, then trim leading and
          # trailing blank lines while leaving interior ones intact.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## / || /^\[[^]]+\]:/) { found = 0 }
            found { lines[n++] = $0 }
            END {
              start = 0; end = n - 1
              while (start < n && lines[start] ~ /^[[:space:]]*$/) start++
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::The [$VERSION] changelog section is empty."
            exit 1
          fi

          {
            printf '\n---\n\n'
            printf '### Installing\n\n'
            printf 'This build is signed ad-hoc rather than with a Developer ID, and is not\n'
            printf 'notarized, so macOS blocks it on first launch.\n\n'
            printf 'Move the app to Applications, then either right-click it and choose\n'
            printf '**Open** and confirm, or run:\n\n'
            printf '```sh\n'
            printf 'xattr -dr com.apple.quarantine "/Applications/SD Card File Importer.app"\n'
            printf '```\n\n'
            printf 'The command removes the download flag and always works; the right-click\n'
            printf 'route depends on your Gatekeeper settings.\n'
          } >> release-notes.md

          echo "Release notes:"
          cat release-notes.md

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Building with CODE_SIGNING_ALLOWED=NO leaves only the ad-hoc signature the
      # linker puts on the executable, with no _CodeSignature/CodeResources for the
      # bundle. Because the bundle does have resources, that signature is
      # structurally invalid rather than merely untrusted, and macOS reports the
      # download as "damaged and can't be opened" -- which right-click > Open
      # cannot bypass. Signing the whole bundle ad-hoc produces a valid signature,
      # so it degrades to the ordinary unidentified-developer prompt instead.
      - name: Ad-hoc sign the bundle
        run: |
          APP="build/Build/Products/Release/$APP_NAME.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ ! -f "$APP/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::No CodeResources produced - the bundle signature is still invalid."
            exit 1
          fi

      - name: Package app
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="build/Build/Products/Release/$APP_NAME.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Built app not found at $APP"
            ls -R build/Build/Products || true
            exit 1
          fi

          ZIP="SD-Card-File-Importer-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: ${{ steps.package.outputs.zip }}
          fail_on_unmatched_files: true
